- type: table
  placement:
    type: component
    config:
      tab_name: Sentry
  widget:
    query: >
      SELECT i.title, i.permalink, i.has_seen, i.status
      FROM issues AS i
      JOIN projects AS p ON p.id = i.project_id
      JOIN organizations AS o ON o.id = p.organization_id
    columns:
      - value: title
        title: Title
        type: string
      - value: permalink
        title: Permalink
        type: string
      - value: has_seen
        title: Has Seen
        type: boolean
      - value: status
        title: Status
        type: string

- type: iframe
  placement:
    type: component
    config:
      tab_name: Sentry Preview
  widget:
    query: "/sentry/iframe"

- type: iframe
  placement:
    type: sideMenuPage
    config:
      title: Hello World
      description: Displays a greeting with the configured message
  widget:
    query: "/ui/hello?org=($ .organization_canonical $)"
