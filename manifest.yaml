description: This plugin is a dummy plugin which contain only a hello world.
icon: https://github.com/cycloid-community-catalog/public-stacks/blob/master/stack-dummy/icon.png
images:
- https://www.cycloid.io/wp-content/uploads/2025/07/Before_cycloid-v1-1024x636.webp
- https://www.cycloid.io/wp-content/uploads/2025/07/With_Cycloid-v1-1024x636.webp
- https://www.cycloid.io/wp-content/uploads/2025/04/fullscreen_dashboard_viewport-only_1440x960_1x-2-e1745837502879-1024x754.png
- https://www.cycloid.io/wp-content/uploads/2025/04/components_cycloid_dashboard.webp
scope:
- organization:project:*
- organization:credential:*
setup:
  readiness_path: /_cy/ping
  min_cpu: "50m"
  min_memory: "64Mi"
  max_cpu: "200m"
  max_memory: "256Mi"
configuration:
- name: "Message"
  description: "Message to display in the job"
  key: message
  widget: simple_text
  type: string
  default: "hello world and especially to you <3"
- name: "External API Credential"
  key: external_api_cred
  description: "Credential for an external API. Select a custom credential; its chosen field will be injected as EXTERNAL_API_CRED env var."
  required: false
  type: string
  widget: cy_cred
  widget_config:
    cred_types: ["custom"]
- name: "Basic Auth Credential"
  key: basic_auth_cred
  description: "Credential for a basic-auth protected service. Select a basic_auth credential; its chosen field will be injected as BASIC_AUTH_CRED env var."
  required: false
  type: string
  widget: cy_cred
  widget_config:
    cred_types: ["basic_auth"]
